model: configs/models/decider_2b.yaml
train: configs/train/sft_lora.yaml
data:
  source: tsqa
  converters: [anomaly]
  splits: [train]
  domains: [Healthcare]
  domain_offset: 3000
  val_fraction: 0.02
  shuffle_options: true
  seed: 0
eval:
  - suffix: dev-health
    data: {source: tsqa, converters: [anomaly], splits: [train], domains: [Healthcare], max_per_domain: 1000, val_fraction: 0.02, shuffle_options: true, seed: 0, state: "@train"}
  - suffix: test-health
    data: {source: tsqa, converters: [anomaly], splits: [train], domains: [Healthcare], max_per_domain: 2000, domain_offset: 1000, val_fraction: 0.02, shuffle_options: true, seed: 0, state: "@train"}
