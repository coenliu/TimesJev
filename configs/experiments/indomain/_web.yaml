model: configs/models/decider_2b.yaml
train: configs/train/sft_lora.yaml
data:
  source: tsqa
  converters: [anomaly]
  splits: [train]
  domains: [The Web]
  domain_offset: 1500
  val_fraction: 0.02
  shuffle_options: true
  seed: 0
eval:
  - suffix: dev-web
    data: {source: tsqa, converters: [anomaly], splits: [train], domains: [The Web], max_per_domain: 500, val_fraction: 0.02, shuffle_options: true, seed: 0, state: "@train"}
  - suffix: test-web
    data: {source: tsqa, converters: [anomaly], splits: [train], domains: [The Web], max_per_domain: 1000, domain_offset: 500, val_fraction: 0.02, shuffle_options: true, seed: 0, state: "@train"}
